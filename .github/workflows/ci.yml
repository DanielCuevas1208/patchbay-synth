name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate and test
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.test()

      - name: Render demo smoke output
        run: julia --project=. bin/patchbay-synth.jl patches/demo.patch --output output/ci-demo.wav --gallery output/ci-gallery --duration 0.25

      - name: Upload rendered demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-julia${{ matrix.version }}
          path: output/
          if-no-files-found: error
